[settings]
task.run_auto_install = false

[tasks.setup]
description = "Verify the Xcode Swift toolchain required by SwiftData"
run = "xcodebuild -version"

[tasks.test]
description = "Run the Swift test suite"
run = "swift test"

[tasks.build]
description = "Build a release Jot.app bundle"
run = "scripts/build-app.sh"

[tasks.install]
description = "Build and install Jot in /Applications"
depends = ["build"]
run = """
osascript -e 'tell application "Jot" to quit' >/dev/null 2>&1 || true
ditto .build/Jot.app /Applications/Jot.app
touch /Applications/Jot.app
open /Applications/Jot.app
"""

[tasks.run]
description = "Build and open Jot"
depends = ["build"]
run = "open .build/Jot.app"
